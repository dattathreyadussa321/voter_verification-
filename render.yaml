services:
  - type: web
    name: boothguard-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: boothguard
      - key: SEED_DEMO_DATA
        value: "true"
      - key: MONGODB_DNS_SERVERS
        value: "1.1.1.1,8.8.8.8"
